<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYCLIMEX - test API</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="font-family:sans-serif;padding:20px">
<h2>SYCLIMEX - test API</h2>
<div id="g_id_onload" data-client_id="658854212904-nttp65hftfr6el8qsjlnbjtk9obubg2t.apps.googleusercontent.com" data-callback="surConnexion" data-auto_prompt="false"></div>
<div class="g_id_signin" data-type="standard" data-size="large" data-text="signin_with" data-locale="fr"></div>
<pre id="resultat" style="white-space:pre-wrap">Non connecte.</pre>
<script>
var URL_API = 'https://script.google.com/macros/s/AKfycbwyWfNdK2cT8TnPPEsKHvsbwMLUa8-csAKNb2n4qenYpvtRuJ97S0RztDwbgfFCdOiO/exec';
var jeton = '';
function appeler(action) {
  return fetch(URL_API, {
    method: 'POST',
    body: JSON.stringify({ action: action, jeton: jeton })
  }).then(function (r) { return r.json(); });
}
function surConnexion(reponse) {
  jeton = reponse.credential;
  var sortie = document.getElementById('resultat');
  sortie.textContent = 'Verification en cours...';
  var actions = ['moi', 'test.admin', 'test.agent', 'action.inconnue'];
  var lignes = [];
  actions.reduce(function (p, a) {
    return p.then(function () {
      return appeler(a)
        .then(function (r) { lignes.push(a + ' : ' + JSON.stringify(r)); })
        .catch(function (e) { lignes.push(a + ' : erreur reseau ' + e.message); });
    });
  }, Promise.resolve()).then(function () {
    sortie.textContent = lignes.join('\n');
  });
}
</script>
</body>
</html>
